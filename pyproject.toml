[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sylph"
version = "0.1.0"
description = "Autonomous AI scout drone companion-computer software"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
sylph = "sylph.cli:main"

[tool.setuptools]
packages = ["sylph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
