[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sylph"
version = "0.1.0"
description = "Autonomous AI scout drone companion-computer software"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Achref Ferjani", email = "cy1ingachref@gmail.com"}]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
sylph = "sylph.cli:main"

[tool.setuptools]
packages = ["sylph"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["sylph"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sylph --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["sylph"]

[tool.coverage.report]
show_missing = true
